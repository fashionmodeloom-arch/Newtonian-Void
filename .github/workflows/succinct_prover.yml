name: Succinct SP1 Environment Setup

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  setup-and-prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install Succinct SP1 SDK & Toolchain
        run: |
          echo "Installing SP1 toolchain using sp1up..."
          curl -L https://sp1up.succinct.xyz | bash
          ~/.sp1/bin/sp1up

          # التحقق من تثبيت أداة cargo prove بنجاح
          export PATH="$HOME/.sp1/bin:$PATH"
          cargo prove --version

      - name: Run Prover Pipeline
        run: |
          echo "Succinct SP1 SDK is fully installed and ready on GitHub server!"
          # سيتم هنا لاحقاً تشغيل أوامر بناء وتوليد البراهين الخاصة بمحركك
